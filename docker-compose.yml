services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: laundry-app
        restart: always
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - laundry
        depends_on:
            - mysql

    nginx:
        image: nginx:alpine
        container_name: laundry-nginx
        restart: always
        ports:
            - "8889:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laundry

    mysql:
        image: mysql:8.0
        container_name: laundry-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: "laundry234"
            MYSQL_DATABASE: laundry
            MYSQL_USER: laundry_user
            MYSQL_PASSWORD: "esduren234"
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laundry

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laundry-phpmyadmin
        restart: always
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: "laundry234"
            PMA_ARBITRARY: 1
        ports:
            - "127.0.0.1:8081:80"
        depends_on:
            - mysql
        networks:
            - laundry

    ngrok:
        image: ngrok/ngrok:latest
        container_name: laundry-ngrok
        restart: always
        command:
            - "http"
            - "nginx:80"
        environment:
            NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
        depends_on:
            - nginx
        ports:
            - "127.0.0.1:4041:4040"
        networks:
            - laundry

networks:
    laundry:
        driver: bridge

volumes:
    mysql_data:
